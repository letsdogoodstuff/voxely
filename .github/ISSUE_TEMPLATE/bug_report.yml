name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
  - type: input
    id: version
    attributes:
      label: voxely version
      description: "`voxely --version`, or the line under Updates in Preferences"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: OS version and GPU
      placeholder: macOS 15.2, M2 / Windows 11, RTX 3060 / Ubuntu 24.04, Intel UHD
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A .vox file that shows the problem (zip it to attach), terminal output, or the agent and tool call if one was involved.
